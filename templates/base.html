<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'AI Business Copilot' }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page-glow glow-one"></div>
  <div class="page-glow glow-two"></div>
  <nav class="topbar glass reveal-down">
    <a class="brand" href="/">
      <span class="brand-mark">AI</span>
      <span><strong>Business Copilot</strong><small>Executive Intelligence</small></span>
    </a>
    <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
    <div class="nav-links">
      <a href="/">Home</a><a href="/services">Services</a><a href="/about">About</a><a href="/contact">Contact</a>
      {% if user %}<a href="/dashboard" class="nav-cta">Dashboard</a><a href="/logout">Logout</a>{% else %}<a href="/login">Login</a><a href="/signup" class="nav-cta">Get Started</a>{% endif %}
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer">
    <p>© AI Business Copilot. Built for sharper decisions, faster insight, and professional reporting.</p>
  </footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
