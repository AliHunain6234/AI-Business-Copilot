{% extends 'base.html' %}{% set title='Signup | AI Business Copilot' %}{% block content %}
<section class="auth-wrap section"><form class="auth-card glass reveal-up" method="post"><span class="eyebrow">Create account</span><h1>Signup</h1>{% if message %}<p class="alert">{{ message }}</p>{% endif %}<label>Name<input name="name" value="{{ name or '' }}" required></label><label>Email<input name="email" type="email" value="{{ email or '' }}" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button class="btn primary full">Create Account</button></form></section>
{% endblock %}
